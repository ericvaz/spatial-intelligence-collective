name: STRANGE feed

# Lists the essays STRANGE has published on Substack under the cover on the
# home page and on strange/. Checks the feed every three hours and commits only
# when an essay has been added, renamed or removed.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strange-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the STRANGE essays from Substack
        run: python3 tools/fetch_strange.py
      - name: Rebuild and publish if the list changed
        run: |
          if git diff --quiet -- content/strange.json; then
            echo "No new essays."
            exit 0
          fi
          python3 tools/build_site.py
          git config user.name "STRANGE feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/strange.json index.html strange/index.html
          git commit -m "STRANGE: update the essay list from Substack"
          git push
